databases:
  - name: flood-monitoring-db
    plan: free
    databaseName: flood_monitoring
    user: flood_monitoring

services:
  - type: web
    name: flood-monitoring-api
    runtime: python
    plan: free
    buildCommand: "cd backend && bash build.sh"
    startCommand: "cd backend && python -m gunicorn backend_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flood-monitoring-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://flood-monitoring-system2.vercel.app,https://floodmonitoringsystem.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://flood-monitoring-system2.vercel.app,https://floodmonitoringsystem.vercel.app"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"
      - key: IOT_API_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "4"
